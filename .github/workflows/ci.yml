name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose identity registration
        run: |
          mkdir -p build
          swiftc Sources/Recorder/App/AppIdentity.swift scripts/identity-probe.swift -o build/identity-probe
          APP=build/IdentityProbe.app BINARY=build/identity-probe VERSION=0.0.0 BUILD=0 SIGN_ID=- scripts/assemble-app.sh
          build/IdentityProbe.app/Contents/MacOS/Recorder
      - run: make test
      - run: make app
      - run: codesign --verify --deep --strict build/Recorder.app
      - run: build/Recorder.app/Contents/MacOS/Recorder --selftest permission-refresh
      - run: build/Recorder.app/Contents/MacOS/Recorder --selftest identity-migration
      - name: Exercise GPU export and color handling on macOS 15
        run: |
          build/Recorder.app/Contents/MacOS/Recorder --selftest export-colors
          build/Recorder.app/Contents/MacOS/Recorder --selftest export-sheet
