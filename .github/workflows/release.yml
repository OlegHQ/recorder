name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Universal DMG
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: scripts/version.sh validate

      - name: Install DMG layout tool
        run: brew install create-dmg

      - name: Configure signing
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            test -n "${!name}" || { echo "Missing required repository secret: $name" >&2; exit 1; }
          done
          case "$APPLE_SIGNING_IDENTITY" in
            'Developer ID Application: '*) ;;
            *) echo 'APPLE_SIGNING_IDENTITY must be a Developer ID Application identity' >&2; exit 1 ;;
          esac
          keychain="$RUNNER_TEMP/recorder-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/recorder-certificate.p12"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/recorder-certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "\"$APPLE_SIGNING_IDENTITY\""
          xcrun notarytool store-credentials RecorderRelease --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$keychain"
          echo "SIGN_ID=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo 'NOTARY_PROFILE=RecorderRelease' >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Build universal DMG
        run: VERSION="${GITHUB_REF_NAME#v}" BUILD="$GITHUB_RUN_NUMBER" scripts/release-dmg.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/Recorder-$version-universal.dmg#Recorder $version (Universal DMG)" \
            --title "Recorder $version" --generate-notes \
            --notes 'Created by [Oleg Pustovit](https://github.com/OlegHQ). Developer ID signed and notarized by Apple.'

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/recorder-build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/recorder-certificate.p12"
