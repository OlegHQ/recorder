name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Universal DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: scripts/version.sh validate

      - name: Install DMG layout tool
        run: brew install create-dmg

      - name: Test
        run: make test

      - name: Build universal DMG
        run: VERSION="${GITHUB_REF_NAME#v}" BUILD="$GITHUB_RUN_NUMBER" SIGN_ID=- scripts/release-dmg.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/Recorder-$version-universal.dmg#Recorder $version (Universal DMG)" \
            --title "Recorder $version" --generate-notes \
            --notes "Created by [Oleg Pustovit](https://github.com/OlegHQ). This DMG is ad-hoc signed and not notarized."
